<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AsistenciaUN — Estudiante</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --surface2: #161b2a;
      --border: #1e2535;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e8eaf0;
      --muted: #6b7280;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
    }

    .nav-brand .icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-name {
      font-size: 13px;
      color: var(--muted);
    }
    .nav-name strong { color: var(--text); }

    .badge-role {
      background: rgba(79,142,247,0.12);
      border: 1px solid rgba(79,142,247,0.25);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover { color: var(--red); border-color: var(--red); }

    /* ── Layout ── */
    main {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .page-sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 36px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      width: fit-content;
    }

    .tab {
      padding: 9px 20px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ── Panels ── */
    .panel { display: none; animation: fadeIn 0.3s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    /* ── Session items ── */
    .session-list { display: flex; flex-direction: column; gap: 12px; }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      animation: fadeIn 0.3s ease both;
    }

    .session-info { flex: 1; }

    .session-subject {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .session-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .session-meta span { margin-right: 14px; }

    .dot-live {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 5px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
      50%       { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
    }

    /* ── Buttons ── */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 9px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Assistance table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 13px 16px;
      color: var(--text);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .pill.presente  { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
    .pill.ausente   { background: rgba(248,113,113,0.12); color: var(--red);   border: 1px solid rgba(248,113,113,0.25); }
    .pill.tarde     { background: rgba(251,191,36,0.12);  color: var(--yellow);border: 1px solid rgba(251,191,36,0.25); }

    /* ── Empty / Loading states ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    .loading-row td {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 14px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: var(--green); }
    #toast.error   { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }

    /* ── Stats strip ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .stat-value.green  { color: var(--green); }
    .stat-value.red    { color: var(--red); }
    .stat-value.accent { color: var(--accent); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-brand">
      <div class="icon">🎓</div>
      AsistenciaUN
    </div>
    <div class="nav-right">
      <span class="nav-name">Hola, <strong id="navName">—</strong></span>
      <span class="badge-role">Estudiante</span>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </nav>

  <!-- Main -->
  <main>
    <div class="page-title">Mi Panel</div>
    <p class="page-sub">Gestiona tu asistencia y clases activas</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('sesiones', this)">🟢 Clases activas</button>
      <button class="tab" onclick="switchTab('historial', this)">📋 Mi historial</button>
    </div>

    <!-- ─── Panel: Sesiones activas ─── -->
    <div class="panel active" id="panel-sesiones">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Clases abiertas ahora</span>
          <button class="btn-secondary" onclick="loadActiveSessions()">↻ Actualizar</button>
        </div>

        <div class="session-list" id="sessionList">
          <div class="empty-state">
            <div class="icon">📡</div>
            <p>Cargando sesiones...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── Panel: Historial de asistencia ─── -->
    <div class="panel" id="panel-historial">

      <!-- Stats -->
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Total registros</div>
          <div class="stat-value accent" id="statTotal">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Presencias</div>
          <div class="stat-value green" id="statPresente">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Ausencias</div>
          <div class="stat-value red" id="statAusente">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Historial de asistencia</span>
          <button class="btn-secondary" onclick="loadMyAssistance()">↻ Actualizar</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Docente</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="assistanceTable">
            <tr class="loading-row"><td colspan="3">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // ─── CONFIGURACIÓN ────────────────────────────────────────────────
    const API_BASE = 'http://localhost:8080';
    // ─────────────────────────────────────────────────────────────────

    const token = localStorage.getItem('token');
    const name  = localStorage.getItem('name') || 'Estudiante';

    // Proteger ruta
    if (!token) window.location.href = 'login.html';

    document.getElementById('navName').textContent = name;

    // Headers con JWT
    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    // ─── Toast ────────────────────────────────────────────────────────
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + type;
      setTimeout(() => { t.className = ''; }, 3200);
    }

    // ─── Tabs ─────────────────────────────────────────────────────────
    function switchTab(name, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      btn.classList.add('active');

      if (name === 'historial') loadMyAssistance();
      if (name === 'sesiones')  loadActiveSessions();
    }

    // ─── Cargar sesiones activas ──────────────────────────────────────
    async function loadActiveSessions() {
      const list = document.getElementById('sessionList');
      list.innerHTML = `<div class="empty-state"><div class="icon">📡</div><p>Buscando clases activas...</p></div>`;

      try {
        const res = await fetch(`${API_BASE}/api/assistance/active-sessions`, {
          headers: authHeaders()
        });

        if (res.status === 403) { handleForbidden(); return; }
        if (!res.ok) throw new Error(await res.text());

        const sessions = await res.json();

        if (!sessions.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">🔕</div><p>No hay clases abiertas en este momento.</p></div>`;
          return;
        }

        list.innerHTML = '';
        sessions.forEach((s, i) => {
          const item = document.createElement('div');
          item.className = 'session-item';
          item.style.animationDelay = `${i * 60}ms`;

          const docenteNombre = s.docente?.name || s.docente?.numberId || '—';
          const docenteId     = s.docente?.numberId || '';
          const fecha = s.fechaApertura
            ? new Date(s.fechaApertura).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
            : '—';

          item.innerHTML = `
            <div class="session-info">
              <div class="session-subject">${s.materia || 'Sin nombre'}</div>
              <div class="session-meta">
                <span><span class="dot-live"></span>En vivo</span>
                <span>👤 ${docenteNombre}</span>
                <span>🕐 Abierta a las ${fecha}</span>
              </div>
            </div>
            <button class="btn-primary" onclick="registerAssistance('${docenteId}', this)">
              ✓ Marcar asistencia
            </button>
          `;
          list.appendChild(item);
        });

      } catch (err) {
        list.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${err.message || 'Error al cargar sesiones'}</p></div>`;
      }
    }

    // ─── Registrar asistencia ─────────────────────────────────────────
    async function registerAssistance(teacherNumberId, btn) {
      btn.disabled = true;
      btn.textContent = '⏳ Enviando...';

      try {
        const res = await fetch(`${API_BASE}/api/assistance/register`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ teacherNumberId })
        });

        const text = await res.text();

        if (res.ok) {
          btn.textContent = '✓ Registrado';
          btn.style.background = 'rgba(52,211,153,0.2)';
          btn.style.color = 'var(--green)';
          btn.style.border = '1px solid rgba(52,211,153,0.3)';
          showToast('¡Asistencia registrada!', 'success');
        } else {
          btn.disabled = false;
          btn.textContent = '✓ Marcar asistencia';
          showToast(text || 'No se pudo registrar la asistencia.', 'error');
        }

      } catch (err) {
        btn.disabled = false;
        btn.textContent = '✓ Marcar asistencia';
        showToast('Error de conexión con el servidor.', 'error');
      }
    }

    // ─── Cargar historial de asistencia ──────────────────────────────
    async function loadMyAssistance() {
      const tbody = document.getElementById('assistanceTable');
      tbody.innerHTML = `<tr class="loading-row"><td colspan="3">Cargando historial...</td></tr>`;

      try {
        const res = await fetch(`${API_BASE}/api/assistance/mine`, {
          headers: authHeaders()
        });

        if (res.status === 403) { handleForbidden(); return; }
        if (!res.ok) throw new Error(await res.text());

        const list = await res.json();

        // Calcular stats
        const total    = list.length;
        const presente = list.filter(a => a.state?.toUpperCase().includes('PRESENT')).length;
        const ausente  = list.filter(a => a.state?.toUpperCase().includes('AUSENTE') || a.state?.toUpperCase().includes('ABSENT')).length;
        document.getElementById('statTotal').textContent   = total;
        document.getElementById('statPresente').textContent = presente;
        document.getElementById('statAusente').textContent  = ausente;

        if (!list.length) {
          tbody.innerHTML = `<tr class="loading-row"><td colspan="3">No tienes registros de asistencia aún.</td></tr>`;
          return;
        }

        tbody.innerHTML = '';
        list.forEach(a => {
          const fecha    = a.date ? new Date(a.date).toLocaleDateString('es-CO') : '—';
          const docente  = a.teacher?.name || a.teacher?.numberId || '—';
          const stateRaw = (a.state || '').toUpperCase();

          let pillClass = 'presente';
          let label     = 'Presente';
          if (stateRaw.includes('AUSENTE') || stateRaw.includes('ABSENT')) {
            pillClass = 'ausente'; label = 'Ausente';
          } else if (stateRaw.includes('TARDE')) {
            pillClass = 'tarde'; label = 'Tarde';
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${fecha}</td>
            <td>${docente}</td>
            <td><span class="pill ${pillClass}">${label}</span></td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        tbody.innerHTML = `<tr class="loading-row"><td colspan="3">⚠️ ${err.message || 'Error al cargar historial'}</td></tr>`;
      }
    }

    // ─── Handlers ─────────────────────────────────────────────────────
    function handleForbidden() {
      showToast('Sesión expirada. Redirigiendo...', 'error');
      setTimeout(() => logout(), 1800);
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // ─── Init ─────────────────────────────────────────────────────────
    loadActiveSessions();
  </script>
</body>
</html>
