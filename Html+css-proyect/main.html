<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asistencia UN — Ingreso</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --border: #1e2535;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #e8eaf0;
      --muted: #6b7280;
      --error: #f87171;
      --success: #34d399;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fondo decorativo */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 65%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -25%;
      right: -15%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 65%);
      pointer-events: none;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px rgba(79,142,247,0.08), 0 32px 64px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .logo-text span {
      display: block;
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 16px;
      align-items: center;
      gap: 8px;
    }
    .alert.error  { display: flex; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--error); }
    .alert.success{ display: flex; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.25); color: var(--success); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .role-hint {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }
    .role-hint strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="logo-area">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">
        AsistenciaUN
        <span>Sistema de Control</span>
      </div>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Ingresa con tu número de identificación</p>

    <div class="field">
      <label for="numberId">Número de identificación</label>
      <input
        id="numberId"
        type="text"
        placeholder="Ej: 1234567890"
        autocomplete="username"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-text">Ingresar</span>
      <div class="spinner"></div>
    </button>

    <div class="alert" id="alertMsg"></div>

    <div class="divider">roles del sistema</div>
    <div class="role-hint">
      Serás redirigido automáticamente según tu rol:<br>
      <strong>Admin</strong> · <strong>Docente</strong> · <strong>Estudiante</strong>
    </div>
  </div>

  <script>
    // ─── CONFIGURACIÓN ───────────────────────────────────────────────
    const API_BASE = 'http://localhost:8080';  // Cambia si tu backend corre en otro puerto
    // ─────────────────────────────────────────────────────────────────

    const input = document.getElementById('password');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('numberId').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    function showAlert(msg, type) {
      const el = document.getElementById('alertMsg');
      el.textContent = msg;
      el.className = 'alert ' + type;
    }

    function decodeToken(token) {
      // JWT tiene 3 partes separadas por '.'
      // La segunda (payload) está en Base64
      try {
        const payload = token.split('.')[1];
        // Base64url → Base64 estándar
        const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(base64));
      } catch (e) {
        return null;
      }
    }

    function getRoleRedirect(role) {
      // El JWT guarda el rol como "ROLE_ADMIN", "ROLE_DOCENTE", "ROLE_ESTUDIANTE"
      if (!role) return null;
      const r = role.toUpperCase();
      if (r.includes('ADMIN'))      return 'admin.html';
      if (r.includes('DOCENTE'))    return 'docente.html';
      if (r.includes('ESTUDIANTE')) return 'estudiante.html';
      return null;
    }

    async function doLogin() {
      const numberId = document.getElementById('numberId').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!numberId || !password) {
        showAlert('Por favor completa todos los campos.', 'error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numberId, password })
        });

        const text = await res.text();  // El backend devuelve el token como texto plano

        if (!res.ok) {
          showAlert(text || 'Credenciales incorrectas.', 'error');
          return;
        }

        // Guardar token en localStorage
        localStorage.setItem('token', text);

        // Decodificar para obtener el rol y el nombre
        const payload = decodeToken(text);
        if (payload) {
          localStorage.setItem('role', payload.role || '');
          localStorage.setItem('name', payload.name || '');
          localStorage.setItem('numberId', payload.sub || '');
        }

        showAlert('¡Acceso correcto! Redirigiendo...', 'success');

        // Redirigir según rol
        setTimeout(() => {
          const destino = getRoleRedirect(payload?.role);
          if (destino) {
            window.location.href = destino;
          } else {
            showAlert('Rol no reconocido: ' + payload?.role, 'error');
          }
        }, 900);

      } catch (err) {
        showAlert('No se pudo conectar con el servidor. ¿Está corriendo el backend?', 'error');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
