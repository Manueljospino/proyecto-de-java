<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Asistencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--green-50); }
    .login-wrap { display: flex; width: 720px; max-width: 95vw; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
    .login-left { background: var(--green-700); flex: 0 0 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; gap: 1rem; }
    .login-left .icon-circle { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
    .login-left .icon-circle i { font-size: 36px; color: var(--green-200); }
    .login-left h1 { font-family: 'Playfair Display', serif; color: var(--green-50); font-size: 20px; text-align: center; line-height: 1.4; }
    .login-left p { font-size: 12px; color: var(--green-400); text-align: center; }
    .login-right { flex: 1; background: var(--white); padding: 2.5rem 2rem; display: flex; flex-direction: column; justify-content: center; }
    .login-right h2 { font-size: 22px; font-weight: 600; color: var(--gray-800); margin-bottom: 4px; }
    .login-right .sub { font-size: 13px; color: var(--gray-400); margin-bottom: 2rem; }
    .roles-row { display: flex; gap: 6px; margin-top: 1.25rem; flex-wrap: wrap; }
    .roles-row .role-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--green-50); color: var(--green-700); border: 0.5px solid var(--green-200); }
    @media (max-width: 520px) { .login-left { display: none; } }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-left">
      <div class="icon-circle"><i class="ti ti-school"></i></div>
      <h1>Sistema de Asistencia</h1>
      <p>Control académico universitario</p>
    </div>
    <div class="login-right">
      <h2>Bienvenido</h2>
      <p class="sub">Ingresa tus credenciales para continuar</p>

      <div id="alert-login" class="alert"></div>

      <div class="field">
        <label for="numberId">Número de ID</label>
        <input type="text" id="numberId" placeholder="Ej: 1005123456" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px;" />
          <button type="button" onclick="toggleLoginPass()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:17px;display:flex;align-items:center;">
            <i class="ti ti-eye" id="login-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" id="btn-login" onclick="handleLogin()">
        <i class="ti ti-login"></i> Iniciar sesión
      </button>

      <div class="roles-row">
        <span class="role-pill"><i class="ti ti-shield"></i> Admin</span>
        <span class="role-pill"><i class="ti ti-chalkboard"></i> Docente</span>
        <span class="role-pill"><i class="ti ti-user"></i> Estudiante</span>
      </div>
    </div>
  </div>

  <script src="Conect.js"></script>
  <script>
    // Si ya está logueado, redirigir
    const role = getRole();
    if (role === 'ADMIN')         location.href = 'Admin/Admin.html';
    else if (role === 'SUBADMIN')   location.href = 'Admin/SubAdmin.html';
    else if (role === 'DOCENTE')    location.href = 'Teacher/Teacher.html';
    else if (role === 'ESTUDIANTE') location.href = 'Student/Student.html';

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    function toggleLoginPass() {
      const input = document.getElementById('password');
      const eye   = document.getElementById('login-eye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'ti ti-eye-off';
      } else {
        input.type = 'password';
        eye.className = 'ti ti-eye';
      }
    }

    async function handleLogin() {
      const numberId = document.getElementById('numberId').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      if (!numberId || !password) {
        showAlert('alert-login', 'Completa todos los campos.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader"></i> Verificando...';

      try {
        await login(numberId, password);
        const role = getRole();
        showAlert('alert-login', '¡Acceso concedido! Redirigiendo...', 'success');
        setTimeout(() => {
          if (role === 'ADMIN')         location.href = 'Admin/Admin.html';
          else if (role === 'SUBADMIN')   location.href = 'Admin/SubAdmin.html';
          else if (role === 'DOCENTE')    location.href = 'Teacher/Teacher.html';
          else                            location.href = 'Student/Student.html';
        }, 800);
      } catch (e) {
        showAlert('alert-login', 'Error: ' + e.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-login"></i> Iniciar sesión';
      }
    }
  </script>
</body>
</html>
