<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de Clases · Asistencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../styles.css" />  <style>
    .session-card {
      background: var(--white);
      border: 0.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.15s;
    }
    .session-card:hover { box-shadow: var(--shadow-md); }
    .session-card.closed { border-left: 3px solid var(--gray-300); }
    .session-card.open   { border-left: 3px solid var(--green-600); }
    .session-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .session-meta { display: flex; align-items: center; gap: 12px; }
    .session-icon { width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--green-50); border: 0.5px solid var(--green-200); display: flex; align-items: center; justify-content: center; color: var(--green-700); font-size: 20px; flex-shrink: 0; }
    .session-subject { font-weight: 600; font-size: 16px; margin: 0; }
    .session-id { font-size: 12px; color: var(--gray-400); margin: 3px 0 0; }
    .attendees-wrap { margin-top: 1rem; border-top: 0.5px solid var(--gray-100); padding-top: 1rem; display: none; }
    .attendees-wrap.show { display: block; }
    .attendee-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--gray-100); }
    .attendee-row:last-child { border-bottom: none; }
    .avatar-xs { width: 30px; height: 30px; border-radius: 50%; background: var(--green-50); border: 0.5px solid var(--green-200); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--green-700); flex-shrink: 0; }
    .count-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--green-700); background: var(--green-50); border: 0.5px solid var(--green-200); border-radius: 20px; padding: 2px 10px; }
    .empty-sm { text-align: center; padding: 1.5rem; color: var(--gray-400); font-size: 13px; }
    .filter-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .filter-bar .field { margin: 0; }
    .filter-bar label { font-size: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand"><i class="ti ti-school"></i> Asistencia</div>
    <div class="nav-user">
      <a href="Teacher.html" class="btn-logout" style="display:flex; align-items:center; gap:6px; text-decoration:none;">
        <i class="ti ti-arrow-left"></i> Panel docente
      </a>
      <span id="nav-user-name"></span>
      <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Salir</button>
    </div>
  </nav>

  <main class="page">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
      <h1 class="page-title" style="margin:0;">Historial de clases</h1>
    </div>

    <!-- Filtro por fechas -->
    <div class="card" style="margin-bottom:1.5rem;">
      <p class="section-title">Filtrar por fecha</p>
      <div class="filter-bar">
        <div class="field">
          <label>Desde</label>
          <input type="date" id="filtro-desde" />
        </div>
        <div class="field">
          <label>Hasta</label>
          <input type="date" id="filtro-hasta" />
        </div>
        <button class="btn btn-primary" onclick="cargarHistorial()">
          <i class="ti ti-search"></i> Buscar
        </button>
        <button class="btn btn-secondary" onclick="limpiarFiltro()">
          <i class="ti ti-x"></i> Limpiar
        </button>
      </div>
    </div>

    <div id="alert-historial" class="alert"></div>
    <div id="historial-wrap">
      <div class="empty"><i class="ti ti-loader"></i><p>Cargando historial...</p></div>
    </div>
  </main>

  <script src="../Conect.js"></script>
  <script src="../sidebar.js"></script>
  <script>
    requireRole('DOCENTE');
    setNavUser();
    buildSidebar('DOCENTE', 'record');
    cargarHistorial();

    function limpiarFiltro() {
      document.getElementById('filtro-desde').value = '';
      document.getElementById('filtro-hasta').value = '';
      cargarHistorial();
    }

    async function cargarHistorial() {
      const wrap = document.getElementById('historial-wrap');
      wrap.innerHTML = '<div class="empty"><i class="ti ti-loader"></i><p>Cargando...</p></div>';

      const desde = document.getElementById('filtro-desde').value;
      const hasta = document.getElementById('filtro-hasta').value;

      const desdeParam = desde ? desde + 'T00:00:00' : null;
      const hastaParam = hasta ? hasta + 'T23:59:59' : null;

      try {
        const data = await getSessionHistory(desdeParam, hastaParam);

        if (!data || data.length === 0) {
          wrap.innerHTML = '<div class="empty"><i class="ti ti-calendar-off"></i><p>No hay clases en ese período.</p></div>';
          return;
        }

        wrap.innerHTML = data.map(s => {
          const fecha = s.fechaApertura ? new Date(s.fechaApertura).toLocaleString('es-CO') : '—';
          const materia = s.subject?.name || '—';
          const estadoClass = s.activa ? 'open' : 'closed';
          const estadoBadge = s.activa
            ? '<span class="badge badge-green"><i class="ti ti-circle-filled" style="font-size:8px;"></i> Abierta</span>'
            : '<span class="badge badge-gray">Cerrada</span>';

          return `
            <div class="session-card ${estadoClass}">
              <div class="session-header">
                <div class="session-meta">
                  <div class="session-icon"><i class="ti ti-book"></i></div>
                  <div>
                    <p class="session-subject">${materia}</p>
                    <p class="session-id">
                      ID: ${s.id} &nbsp;·&nbsp; ${fecha} &nbsp;·&nbsp; ${estadoBadge}
                    </p>
                  </div>
                </div>
                <button class="btn btn-secondary" onclick="toggleAsistidos(${s.id})">
                  <i class="ti ti-users"></i> Ver asistidos
                </button>
              </div>
              <div class="attendees-wrap" id="asistidos-${s.id}">
                <div class="empty-sm"><i class="ti ti-loader"></i> Cargando...</div>
              </div>
            </div>`;
        }).join('');

      } catch (e) {
        wrap.innerHTML = `<div class="empty"><i class="ti ti-alert-circle"></i><p>${e.message}</p></div>`;
      }
    }

    async function toggleAsistidos(sessionId) {
      const wrap = document.getElementById(`asistidos-${sessionId}`);
      if (wrap.classList.contains('show')) {
        wrap.classList.remove('show');
        return;
      }
      wrap.classList.add('show');
      wrap.innerHTML = '<div class="empty-sm"><i class="ti ti-loader"></i> Cargando...</div>';

      try {
        const data = await getSessionDetail(sessionId);

        if (!data || data.length === 0) {
          wrap.innerHTML = '<div class="empty-sm"><i class="ti ti-user-off"></i> No hubo asistidos en esta clase.</div>';
          return;
        }

        const presentes = data.filter(a => a.state === 'Presente');
        const ausentes  = data.filter(a => a.state === 'Ausente');

        wrap.innerHTML = `
          <div style="display:flex; gap:10px; margin-bottom:0.75rem; flex-wrap:wrap;">
            <span class="count-badge"><i class="ti ti-users"></i> ${data.length} estudiante${data.length !== 1 ? 's' : ''}</span>
            <span class="count-badge" style="color:var(--green-700);"><i class="ti ti-check"></i> ${presentes.length} presentes</span>
            <span class="count-badge" style="color:var(--red-700); background:var(--red-50); border-color:var(--red-200);"><i class="ti ti-x"></i> ${ausentes.length} ausentes</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>ID Estudiante</th><th>Nombre</th><th>Estado</th><th>Hora de registro</th></tr>
              </thead>
              <tbody>
                ${data.map((a, i) => {
                  const hora = a.date ? new Date(a.date).toLocaleString('es-CO') : '—';
                  const badgeClass = a.state === 'Presente' ? 'badge-green' : 'badge-red';
                  const initials = (a.student?.name || '?').split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
                  return `<tr>
                    <td>${i + 1}</td>
                    <td>${a.student?.numberId || '—'}</td>
                    <td>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div class="avatar-xs">${initials}</div>
                        ${a.student?.name || '—'}
                      </div>
                    </td>
                    <td><span class="badge ${badgeClass}">${a.state || '—'}</span></td>
                    <td>${hora}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (e) {
        wrap.innerHTML = `<div class="empty-sm" style="color:var(--red-700);">${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
